site_name: Dungeon Crawler Carl RPG - Regole
site_description: Regole del Dungeon Crawler Carl RPG (Core Rulebook, Royal Court Edition), capitoli 1-6

theme:
  name: material
  features:
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow
    - search.share
    - header.autohide

  language: it
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Passa alla modalità scura
      primary: orange
      accent: purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Passa alla modalità chiara
      primary: orange
      accent: lime

plugins:
  - search
  - tags

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [includes]
      auto_append: [glossary.md]
  - abbr
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - tables
  - toc:
      permalink: true

hooks:
  - hooks/autolink.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/enhance.js

validation:
  anchors: warn

